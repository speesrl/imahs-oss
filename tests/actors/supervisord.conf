[supervisord]
nodaemon=true

[program:llm]
command=python -m llm
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
environment = SUPERVISOR_PROCESS_NUM=%(process_num)d
numprocs=10
stdout_logfile=/workspace/files/%(program_name)s_%(process_num)02d.log
stderr_logfile=/workspace/files/%(program_name)s_%(process_num)02d.log
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:mt]
command=python -m mt
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
environment = SUPERVISOR_PROCESS_NUM=%(process_num)d
numprocs=10
stdout_logfile=/workspace/files/%(program_name)s_%(process_num)02d.log
stderr_logfile=/workspace/files/%(program_name)s_%(process_num)02d.log
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0


